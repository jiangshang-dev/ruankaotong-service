<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学科管理 · 软考通管理后台</title>
  <link rel="stylesheet" href="./css/admin.css">
</head>
<body>
  <div id="app">
    <div id="page" data-nav="subjects" data-title="学科管理">
      <p class="note">对应桌面端左侧「学科」列表。停用后客户端不再显示。</p>
      <div class="card" style="margin-bottom:14px">
        <h3>新增学科</h3>
        <form id="add-form" class="form-grid">
          <div class="field">
            <label>ID（英文）</label>
            <input name="id" placeholder="architect" required>
          </div>
          <div class="field">
            <label>名称</label>
            <input name="name" placeholder="系统架构设计师" required>
          </div>
          <div class="field">
            <label>简称</label>
            <input name="shortName" placeholder="架构">
          </div>
          <div class="field">
            <label>级别</label>
            <select name="level">
              <option>高级</option>
              <option>中级</option>
              <option>初级</option>
            </select>
          </div>
          <div class="actions full">
            <button class="btn" type="submit">保存</button>
          </div>
        </form>
      </div>
      <div class="card">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>名称</th>
              <th>简称</th>
              <th>级别</th>
              <th>状态</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="./js/common.js"></script>
  <script>
    async function renderList() {
      const rows = await Admin.api("/api/admin/subjects");
      document.getElementById("rows").innerHTML = rows.map((s) => `
        <tr>
          <td><code class="path">${Admin.esc(s.id)}</code></td>
          <td>${Admin.esc(s.name)}</td>
          <td>${Admin.esc(s.shortName)}</td>
          <td><span class="badge ${s.level === "高级" ? "ok" : s.level === "中级" ? "info" : "muted"}">${Admin.esc(s.level)}</span></td>
          <td>${s.enabled === 1 ? '<span class="badge ok">启用</span>' : '<span class="badge muted">停用</span>'}</td>
          <td>
            <button class="btn ghost sm toggle" data-id="${Admin.esc(s.id)}" data-on="${s.enabled === 1 ? "1" : "0"}" type="button">${s.enabled === 1 ? "停用" : "启用"}</button>
          </td>
        </tr>
      `).join("");
    }
    document.addEventListener("admin:ready", async () => {
      await renderList();
      document.getElementById("rows").addEventListener("click", async (e) => {
        const btn = e.target.closest(".toggle");
        if (!btn) return;
        try {
          await Admin.api("/api/admin/subjects/toggle", {
            method: "POST",
            body: JSON.stringify({ id: btn.dataset.id, enabled: btn.dataset.on !== "1" }),
          });
          await renderList();
        } catch (err) {
          Admin.toast(err.message);
        }
      });
      document.getElementById("add-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.currentTarget);
        try {
          await Admin.api("/api/admin/subjects", {
            method: "POST",
            body: JSON.stringify({
              id: String(fd.get("id") || "").trim(),
              name: String(fd.get("name") || "").trim(),
              shortName: String(fd.get("shortName") || "").trim(),
              level: String(fd.get("level") || "中级"),
              enabled: true,
            }),
          });
          e.currentTarget.reset();
          Admin.toast("已新增学科");
          await renderList();
        } catch (err) {
          Admin.toast(err.message);
        }
      });
    });
  </script>
</body>
</html>
