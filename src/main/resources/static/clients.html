<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客户端 IP · 软考通管理后台</title>
  <link rel="stylesheet" href="./css/admin.css">
</head>
<body>
  <div id="app">
    <div id="page" data-nav="clients" data-title="客户端 IP">
      <p class="note">笔记、论文、案例可免登录使用。调用 AI 时需邮箱验证码登录，同时记录来源 IP 和邮箱名称。</p>
      <div class="card">
        <div class="toolbar">
          <input id="q" placeholder="搜索 IP / 邮箱名称">
          <button class="btn ghost" type="button" id="search">筛选</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>客户端 IP</th>
              <th>邮箱名称</th>
              <th>最近访问</th>
              <th>问答次数</th>
              <th>用过的模块</th>
              <th>最近科目</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="./js/common.js"></script>
  <script>
    async function renderList() {
      const q = (document.getElementById("q").value || "").trim();
      const rows = await Admin.api("/api/admin/clients?ip=" + encodeURIComponent(q));
      document.getElementById("rows").innerHTML = rows.length ? rows.map((c) => `
        <tr>
          <td class="ip">${Admin.esc(c.ip)}</td>
          <td>${Admin.esc(c.email || "")}</td>
          <td>${Admin.esc(Admin.fmt(c.lastSeen))}</td>
          <td>${c.count || 0}</td>
          <td>${String(c.modules || "").split(",").filter(Boolean).map((m) => `<span class="badge info">${Admin.esc(m)}</span>`).join(" ")}</td>
          <td>${Admin.esc(c.subject || "")}</td>
          <td><a class="btn ghost sm" href="./qa.html?ip=${encodeURIComponent(c.ip)}">查看问答</a></td>
        </tr>
      `).join("") : `<tr><td colspan="7">暂无客户端</td></tr>`;
    }
    document.addEventListener("admin:ready", () => {
      renderList();
      document.getElementById("search").onclick = renderList;
      document.getElementById("q").addEventListener("keydown", (e) => {
        if (e.key === "Enter") renderList();
      });
    });
  </script>
</body>
</html>
