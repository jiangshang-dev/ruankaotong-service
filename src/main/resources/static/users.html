<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理 · 软考通管理后台</title>
  <link rel="stylesheet" href="./css/admin.css">
</head>
<body>
  <div id="app">
    <div id="page" data-nav="users" data-title="用户管理">
      <p class="note">邮箱验证码登录的全部用户。可启用 / 禁用账号；禁用后立即退出登录，无法再使用 AI。</p>
      <div class="card">
        <div class="toolbar">
          <input id="q" placeholder="搜索邮箱 / 昵称">
          <button class="btn ghost" type="button" id="search">筛选</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>昵称</th>
              <th>邮箱名称</th>
              <th>状态</th>
              <th>注册时间</th>
              <th>最近登录</th>
              <th>AI 次数</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="./js/common.js"></script>
  <script>
    async function renderList() {
      const q = (document.getElementById("q").value || "").trim();
      const rows = await Admin.api("/api/admin/users?q=" + encodeURIComponent(q));
      document.getElementById("rows").innerHTML = rows.length ? rows.map((u) => {
        const on = Number(u.enabled) === 1;
        return `
        <tr>
          <td>${Admin.esc(u.name || "")}</td>
          <td>${Admin.esc(u.email || "")}</td>
          <td>${on ? '<span class="badge ok">启用</span>' : '<span class="badge muted">禁用</span>'}</td>
          <td>${Admin.esc(Admin.fmt(u.createdAt))}</td>
          <td>${Admin.esc(Admin.fmt(u.lastLoginAt))}</td>
          <td>${u.qaCount || 0}</td>
          <td>
            <button class="btn ghost sm toggle" data-id="${Admin.esc(u.id)}" data-on="${on ? "1" : "0"}" type="button">${on ? "禁用" : "启用"}</button>
            <a class="btn ghost sm" href="./qa.html?ip=${encodeURIComponent(u.email || "")}">查看问答</a>
          </td>
        </tr>`;
      }).join("") : `<tr><td colspan="7">暂无用户</td></tr>`;
    }
    document.addEventListener("admin:ready", () => {
      renderList();
      document.getElementById("search").onclick = renderList;
      document.getElementById("q").addEventListener("keydown", (e) => {
        if (e.key === "Enter") renderList();
      });
      document.getElementById("rows").addEventListener("click", async (e) => {
        const btn = e.target.closest(".toggle");
        if (!btn) return;
        try {
          await Admin.api("/api/admin/users/toggle", {
            method: "POST",
            body: JSON.stringify({ id: Number(btn.dataset.id), enabled: btn.dataset.on !== "1" }),
          });
          Admin.toast(btn.dataset.on === "1" ? "已禁用" : "已启用");
          await renderList();
        } catch (err) {
          Admin.toast(err.message);
        }
      });
    });
  </script>
</body>
</html>
