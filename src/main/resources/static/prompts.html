<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>提示词 · 软考通管理后台</title>
  <link rel="stylesheet" href="./css/admin.css">
</head>
<body>
  <div id="app">
    <div id="page" data-nav="prompts" data-title="提示词">
      <p class="note">按桌面端三个模块拆开：知识点笔记、论文练习、案例分析。</p>
      <div class="split">
        <div class="list" id="list"></div>
        <div class="card editor">
          <h3 id="title">提示词</h3>
          <p id="meta" style="margin:-8px 0 12px;color:var(--muted);font-size:12px"></p>
          <textarea id="text"></textarea>
          <div class="actions">
            <button class="btn" type="button" id="save">保存提示词</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="./js/mock.js"></script>
  <script src="./js/common.js"></script>
  <script>
    let current = MOCK.prompts[0].id;
    function show() {
      const item = MOCK.prompts.find((p) => p.id === current) || MOCK.prompts[0];
      document.getElementById("list").innerHTML = MOCK.prompts.map((p) => `
        <button type="button" data-id="${p.id}" class="${p.id === item.id ? "active" : ""}">
          ${Admin.esc(p.name)}
          <small>${Admin.esc(p.module)} · ${Admin.esc(p.file)}</small>
        </button>
      `).join("");
      document.getElementById("title").textContent = item.name;
      document.getElementById("meta").textContent = item.module + " · classpath:prompts/" + item.file;
      document.getElementById("text").value = item.text;
    }
    document.addEventListener("admin:ready", () => {
      show();
      document.getElementById("list").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-id]");
        if (!btn) return;
        current = btn.dataset.id;
        show();
      });
      document.getElementById("save").onclick = () => Admin.toast("提示词未写入后端，仅页面演示");
    });
  </script>
</body>
</html>
