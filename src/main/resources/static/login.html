<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 软考通管理后台</title>
  <link rel="stylesheet" href="./css/admin.css">
</head>
<body>
  <div id="app">
    <div class="login-wrap">
      <form class="login-card" id="login-form">
        <div class="login-mark">软</div>
        <h1>软考通管理后台</h1>
        <p>仅管理员需要登录。桌面客户端不登录，只记录 IP。</p>
        <div class="field">
          <label>账号</label>
          <input name="account" value="admin" autocomplete="username">
        </div>
        <div class="field">
          <label>密码</label>
          <input name="password" type="password" value="admin123" autocomplete="current-password">
        </div>
        <button class="btn block" type="submit">登录</button>
        <div class="hint">默认账号 admin / admin123，登录后可在系统设置改密</div>
      </form>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="./js/common.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.currentTarget);
      try {
        const data = await Admin.api("/api/admin/login", {
          method: "POST",
          body: JSON.stringify({
            account: String(fd.get("account") || "").trim(),
            password: String(fd.get("password") || "").trim(),
          }),
        });
        Admin.saveLogin(data);
        location.href = "./index.html";
      } catch (err) {
        Admin.toast(err.message || "登录失败");
      }
    });
  </script>
</body>
</html>
