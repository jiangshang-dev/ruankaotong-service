<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统设置 · 软考通管理后台</title>
  <link rel="stylesheet" href="./css/admin.css">
</head>
<body>
  <div id="app">
    <div id="page" data-nav="settings" data-title="系统设置">
      <div class="grid-2">
        <div class="card">
          <h3>管理员登录</h3>
          <p class="note">只有管理后台要账号密码登录。桌面端笔记编辑免登录，使用 AI 时需邮箱验证码。</p>
          <form id="admin-form">
            <div class="field">
              <label>当前账号</label>
              <input id="account" disabled>
            </div>
            <div class="field">
              <label>原密码</label>
              <input name="oldPassword" type="password">
            </div>
            <div class="field">
              <label>新密码</label>
              <input name="password" type="password" placeholder="至少 6 位">
            </div>
            <div class="field">
              <label>确认新密码</label>
              <input name="confirm" type="password">
            </div>
            <button class="btn" type="submit">保存</button>
          </form>
        </div>
        <div class="card">
          <h3>客户端规则</h3>
          <p class="note">桌面端编辑笔记、论文、案例不要求登录；生成辅导 / 润色 / 讲解 / 评分需要邮箱验证码登录。</p>
          <table>
            <tbody>
              <tr><th>身份</th><td>AI 用邮箱验证码登录，同时记录客户端 IP 和邮箱名称</td></tr>
              <tr><th>记录内容</th><td>IP、邮箱名称、学科、文件、问题、AI 回答、时间</td></tr>
              <tr><th>会话</th><td>仍可按科目 + 文件名读 Redis 历史</td></tr>
              <tr><th>管理端</th><td>必须登录后才能看问答和配置</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <script src="./js/common.js"></script>
  <script>
    document.addEventListener("admin:ready", () => {
      const user = Admin.user();
      document.getElementById("account").value = user?.account || "admin";
      document.getElementById("admin-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.currentTarget);
        const password = String(fd.get("password") || "");
        const confirm = String(fd.get("confirm") || "");
        if (password.length < 6) {
          Admin.toast("新密码至少 6 位");
          return;
        }
        if (password !== confirm) {
          Admin.toast("两次密码不一致");
          return;
        }
        try {
          await Admin.api("/api/admin/password", {
            method: "POST",
            body: JSON.stringify({
              oldPassword: String(fd.get("oldPassword") || ""),
              newPassword: password,
            }),
          });
          Admin.toast("密码已更新");
          e.currentTarget.reset();
          document.getElementById("account").value = user?.account || "admin";
        } catch (err) {
          Admin.toast(err.message);
        }
      });
    });
  </script>
</body>
</html>
