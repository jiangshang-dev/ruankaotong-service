server:
  port: ${SERVER_PORT:9002}
  tomcat:
    max-http-form-post-size: 30MB
    max-swallow-size: 30MB

spring:
  application:
    name: ruankao-back
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:rm-2zewdohwf3z10y6ru6o.mysql.rds.aliyuncs.com}:3306/${MYSQL_DB:ruankao}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:jeecg}
    password: ${MYSQL_PASSWORD:Ling@7ujm}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  main:
    web-application-type: servlet
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  mvc:
    async:
      request-timeout: 240000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s

# AgentScope 2：OpenAI 兼容端点（本地 vLLM / 通义等）
# 可用环境变量或 docs/start.bat 覆盖，勿把真实 Key 提交到仓库
ruankao:
  ai:
    base-url: ${LLM_BASE_URL:https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
    model-name: ${LLM_MODEL_NAME:qwen3.8-max}
    api-key: ${LLM_API_KEY:sk-sp-H.XMLRH.Y6F9.MEUCIEAtQ0KSpVo5OwewjAnhy2YIESrnbBxmDXpZ9sxlN5MHAiEAzVX9zCHyiRgSn8KbOL7zlwrolV6MdsYmcEbazO3FS1U}
    stream: false
    # 系统提示词文件（classpath:prompts/ 下）
    polish-prompt: classpath:prompts/ruankao-polish-system.txt
    score-prompt: classpath:prompts/ruankao-score-system.txt
    case-solve-prompt: classpath:prompts/ruankao-case-solve-system.txt
    case-score-prompt: classpath:prompts/ruankao-case-score-system.txt
    case-explain-stream-prompt: classpath:prompts/ruankao-case-explain-stream-system.txt
    guide-prompt: classpath:prompts/ruankao-essay-guide-system.txt
    guide-stream-prompt: classpath:prompts/ruankao-essay-guide-stream-system.txt
    knowledge-tutor-stream-prompt: classpath:prompts/ruankao-knowledge-tutor-stream-system.txt
    # 综合知识讲义（src/main/resources/docs），打进 JAR，不要改成本机绝对路径
    knowledge-docs: classpath:docs
    # 案例分析识图模型；留空则使用 model-name。主模型不支持图片时改为 qwen-vl-max / qwen3-vl-plus 等
    vision-model-name: ${LLM_VISION_MODEL_NAME:}
    # 单次请求超时（秒）
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:180}
  mail:
    host: ${MAIL_HOST:smtp.163.com}
    port: ${MAIL_PORT:465}
    auth: true
    ssl-enable: true
    from: ${MAIL_FROM:wuzhixin666@163.com}
    from-name: ${MAIL_FROM_NAME:软考通}
    user: ${MAIL_USER:wuzhixin666@163.com}
    pass: ${MAIL_PASS:RVe5VbNd2KLpnHCL}

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

# Swagger UI: http://localhost:9001/swagger-ui.html
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
