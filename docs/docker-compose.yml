# 适配 /home/node：本文件与 Dockerfile、target/ 同目录
#
#   cd /home/node
#   export LLM_API_KEY=sk-你的密钥
#   docker compose up -d --build
#
# Redis 用已有容器 my-redis（宿主机 6379），本文件不再起 Redis。
# 密钥用环境变量或同目录 .env，不要写进本文件。

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: target/ruankao-back-1.0-SNAPSHOT.jar
    image: ruankao-back:1.0
    container_name: ruankao-back
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9001:9001"
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: "9001"
      REDIS_HOST: host.docker.internal
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-Ling@7ujm}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      LLM_API_KEY: ${LLM_API_KEY:-sk-sp-H.XMLRH.Y6F9.MEUCIEAtQ0KSpVo5OwewjAnhy2YIESrnbBxmDXpZ9sxlN5MHAiEAzVX9zCHyiRgSn8KbOL7zlwrolV6MdsYmcEbazO3FS1U}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-qwen3.8-max}
      LLM_VISION_MODEL_NAME: ${LLM_VISION_MODEL_NAME:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-180}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m -XX:+UseG1GC}
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9001'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
