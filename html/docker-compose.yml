# 官网 + Redis Manager（同一容器，路径区分）
#
#   https://www.fondia.top/            软考智笔
#   https://www.fondia.top/redishtml/  Redis Manager
#
# 证书：
#   /home/docker/ssl/www.fondia.top.pem
#   /home/docker/ssl/www.fondia.top.key
#
#   cd html
#   docker compose up -d --build
#
# 截图 ./images/ ；软考安装包 ./downloads/ ；
# Redis 页静态文件 ./redishtml/ （已挂载，改完刷新即可）

services:
  site:
    build: .
    image: ruankao-zhibi-site:1.0
    container_name: ruankao-zhibi-site
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./images:/usr/share/nginx/html/images:ro
      - ./downloads:/usr/share/nginx/html/downloads:ro
      - ./redishtml:/usr/share/nginx/html/redishtml:ro
      - ${SSL_DIR:-/home/docker/ssl}/www.fondia.top.pem:/etc/nginx/ssl/www.fondia.top.pem:ro
      - ${SSL_DIR:-/home/docker/ssl}/www.fondia.top.key:/etc/nginx/ssl/www.fondia.top.key:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 5s
