# HTTP：跳转到 https://www.fondia.top
server {
    listen 80;
    server_name www.fondia.top fondia.top;
    return 301 https://www.fondia.top$request_uri;
}

# HTTPS：一站点多路径
#   /           → 软考智笔官网
#   /redishtml/ → Redis Manager 宣传页
server {
    listen 443 ssl;
    http2 on;
    server_name www.fondia.top fondia.top;

    ssl_certificate     /etc/nginx/ssl/www.fondia.top.pem;
    ssl_certificate_key /etc/nginx/ssl/www.fondia.top.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css text/plain application/javascript image/svg+xml;

    location = /redishtml {
        return 301 /redishtml/;
    }

    location /redishtml/ {
        try_files $uri $uri/ /redishtml/index.html;
    }

    location /downloads/ {
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
    }

    location = /robots.txt {
        access_log off;
    }

    location = /sitemap.xml {
        default_type application/xml;
        access_log off;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
